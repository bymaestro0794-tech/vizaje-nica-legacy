---
deployment:
  tasks:
    - export DEPLOYPATH=/home/vizajeni/dev.vizaje-nica.com/
    - cd /home/vizajeni/repositories/vizaje-nica-legacy &&
      /usr/local/bin/composer install --no-dev --optimize-autoloader
      --no-interaction
    - /bin/rsync -a --exclude=".git/" --exclude=".env"
      --exclude="application/config/database.php" --exclude="application/logs/"
      --exclude="public/uploads/"
      /home/vizajeni/repositories/vizaje-nica-legacy/ $DEPLOYPATH
