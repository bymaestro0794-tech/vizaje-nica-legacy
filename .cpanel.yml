---
deployment:
  tasks:
    - export DEPLOYPATH=/home/vizajeni/developer.vizaje-nica.com/
    - test "$DEPLOYPATH" = "/home/vizajeni/developer.vizaje-nica.com/" && test -d "$DEPLOYPATH"
    - cd "$(git rev-parse --show-toplevel)" && tar -cf -
      --exclude=".git" --exclude=".env"
      --exclude="application/config/database.php" --exclude="application/logs"
      --exclude="public/uploads" . | (cd "$DEPLOYPATH" && tar -xf -
      --no-same-permissions --no-same-owner)
    - find "$DEPLOYPATH" -type d -exec chmod 755 {} +
    - find "$DEPLOYPATH" -type f -exec chmod 644 {} +
