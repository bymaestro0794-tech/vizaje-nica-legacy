---
deployment:
  tasks:
    - export DEPLOYPATH=/home/vizajeni/dev.vizaje-nica.com/
    - test "$DEPLOYPATH" = "/home/vizajeni/dev.vizaje-nica.com/" && test -d "$DEPLOYPATH" && test -w "$DEPLOYPATH"
    - cd "$(git rev-parse --show-toplevel)" && set -o pipefail && git archive --format=tar HEAD | tar -xf - -C "$DEPLOYPATH" --no-same-permissions --no-same-owner --exclude='application/config/database.php' --exclude='application/logs' --exclude='application/cache/vn_frontend_*' --exclude='public/uploads' --exclude='site-meilisearch.env' --exclude='.env'
